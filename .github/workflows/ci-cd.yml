name: Static Website CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test website
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: static-website-cicd
      CONTAINER_NAME: static-website-cicd-test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify required files
        run: |
          required_files=(
            "index.html"
            "styles.css"
            "script.js"
            "Dockerfile"
            "nginx.conf"
            ".dockerignore"
            ".gitignore"
          )
          for file in "${required_files[@]}"; do
            test -f "$file" || { echo "Missing required file: $file"; exit 1; }
          done

      - name: Build Docker image
        run: docker build --tag "$IMAGE_NAME:ci" .

      - name: Start test container
        run: docker run --detach --publish 8080:80 --name "$CONTAINER_NAME" "$IMAGE_NAME:ci"

      - name: Test website and health endpoint
        run: |
          set -euo pipefail
          health_check_passed=false
          for attempt in {1..10}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/health; then
              health_check_passed=true
              break
            fi
            sleep 1
          done
          test "$health_check_passed" = "true"
          curl --fail --silent --show-error http://127.0.0.1:8080/ | grep -q "LaunchPad"
          test "$(curl --fail --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/health)" = "200"

      - name: Stop and remove test container
        if: always()
        run: docker rm --force "$CONTAINER_NAME" 2>/dev/null || true
